name: hourly
on:
  schedule:
    # GitHub drops most scheduled runs: an hourly cron ran only 4-5 times a day (Nov 6-9).
    # Ask six times an hour; the check job lets a build through only when the last one is 45+ minutes old.
    # tools/trigger-worker.js (Cloudflare Workers cron) can ask too, through workflow_dispatch.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even when the last build is less than 45 minutes old"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "cities.json"
      - "tests/**"
      - ".github/workflows/hourly.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hourly
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - id: age
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          run=true
          if [ "$EVENT" != "push" ] && [ "$FORCE" != "true" ]; then
            gen=$(curl -fsS --max-time 20 https://ditailgptwork.github.io/honest-air-data/v1/status.json \
                  | python3 -c "import json,sys; print(json.load(sys.stdin)['generated'])" || true)
            if [ -n "$gen" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$gen" +%s) ))
              echo "last build $gen, ${age}s ago"
              if [ "$age" -lt 2700 ]; then run=false; fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/test_offline.py
      - uses: actions/cache/restore@v5
        with:
          path: cache
          key: cams-${{ github.run_id }}
          restore-keys: cams-
      - id: build
        run: python -u -m pipeline.build
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      - if: steps.build.outputs.cams_updated == 'true'
        uses: actions/cache/save@v5
        with:
          path: cache
          key: cams-${{ github.run_id }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
